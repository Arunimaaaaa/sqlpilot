version: '3.8'

services:
  # Microsoft SQL Server 2022 Container
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlpilot-mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SqlPilotStrongP@ss2026!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./sql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SqlPilotStrongP@ss2026!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # SQL Server DB Initialization Service
  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlpilot-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./sql-init:/sql-init
    entrypoint: >
      /bin/bash -c "
        echo 'Waiting for SQL Server to be ready...';
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'SqlPilotStrongP@ss2026!' -C -i /sql-init/01-init-metadata.sql;
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'SqlPilotStrongP@ss2026!' -C -i /sql-init/02-init-sampledb.sql;
        echo 'Databases initialized successfully!';
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sqlpilot-api
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - JWT_SECRET=sqlpilot-dev-jwt-super-secret-key-32chars
      - METADATA_DB_SERVER=sqlserver
      - METADATA_DB_PORT=1433
      - METADATA_DB_NAME=SQLPilotMeta
      - METADATA_DB_USER=sa
      - METADATA_DB_PASSWORD=SqlPilotStrongP@ss2026!
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./api:/app
      - /app/node_modules

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: sqlpilot-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - api
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next

volumes:
  mssql_data:
